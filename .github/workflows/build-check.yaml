name: Build Check
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

jobs:
  BuildDebug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      
      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Apply Core Patches
        run: |
          cd core/src/foss/golang/clash
          for p in $GITHUB_WORKSPACE/.github/patch-core/*.patch; do patch --verbose -p 1 < "$p"; done

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      # Разбор заголовков панели и распознавание узлов-заглушек живут в Go, и
      # проверяются они тоже на Go — самым первым шагом: пакеты
      # `native/config/panel` и `native/config/sentinel` не зависят ни от ядра,
      # ни от Android, собираются из одной стандартной библиотеки за секунду,
      # и ждать ради них Gradle с NDK незачем.
      #
      # Именно этот пакет, а не `native/config` целиком: соседи по каталогу
      # тянут `native/app`, а тот зовёт mihomo-функции из файла с тегами
      # `android && cmfa` — на хост-платформе их нет, и сборка падает.
      - name: Go unit tests
        id: go-tests
        if: success()
        working-directory: core/src/main/golang
        run: |
          go test ./native/config/panel/... ./native/config/sentinel/... ./native/chanx/... ./native/redact/...
          go test ./native/diagnostics.go ./native/diagnostics_log.go ./native/diagnostics_test.go
          go test \
            ./native/config/controller_access.go \
            ./native/config/process.go \
            ./native/config/process_test.go \
            ./native/config/override.go \
            ./native/config/defaults.go \
            ./native/config/provider.go \
            ./native/config/panel.go

      # Unit-тесты на чистые считалки — ДО сборки приложения: они дешевле
      # (:core им нужен, а вот сборка APK, R8 и упаковка — нет), и красная
      # считалка не должна стоить полного прогона до фидбэка. В том же джобе,
      # а не отдельным: Go на :core тратится один раз на оба шага.
      #
      # Три модуля: :service (пороги напоминаний, разбор panel.json),
      # :core (упакованный счётчик трафика), :design (размеры, имена файлов
      # логов, проверки полей ввода).
      - name: Unit tests
        id: unit-tests
        if: success()
        run: >-
          ./gradlew --no-daemon -Pclod.abi=arm64-v8a
          service:testStandardDebugUnitTest
          core:testStandardDebugUnitTest
          design:testStandardDebugUnitTest

      - name: Upload Test Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.unit-tests.outcome == 'failure' }}
        with:
          name: unit-test-report
          if-no-files-found: ignore
          # HTML — читать глазами, XML — машине: без него результат теста
          # виден только внутри архива.
          path: |
            service/build/reports/tests/
            service/build/test-results/
            core/build/reports/tests/
            core/build/test-results/
            design/build/reports/tests/
            design/build/test-results/

      - name: Build
        if: success()
        run: ./gradlew --no-daemon app:assembleStandardDebug -Pclod.abi=arm64-v8a

      # 32-разрядная сборка Go не проверялась ни разу до пуша тега, хотя в дереве
      # лежит патч тулчейна специально под неё: поломка всплывала уже после того,
      # как черновик релиза создан. Гоняем только Go-библиотеку под armeabi-v7a,
      # без CMake, JNI и упаковки APK.
      - name: Build Go for armeabi-v7a
        if: success()
        run: >-
          ./gradlew --no-daemon -Pclod.abi=armeabi-v7a
          core:externalGolangBuildStandardDebugArmeabiV7a

      # Один артефакт вместо четырёх: сборка идёт по одной ABI (-Pclod.abi=arm64-v8a),
      # flavor схлопнут в standard, тип debug. Прежние четыре шага указывали на
      # apk/alpha/release/* — этого каталога после ребрендинга не существует,
      # и артефакт не выкладывался вообще.
      - name: Upload Artifact (debug, arm64-v8a)
        uses: actions/upload-artifact@v7
        if: ${{ success() }}
        with:
          name: clodclash-debug-arm64-v8a
          if-no-files-found: error
          path: |
            app/build/outputs/apk/standard/debug/*.apk

      # Слитый манифест: разрешения, uses-feature и exported-компоненты
      # приезжают из библиотек (сканер QR, стартовый провайдер AndroidX),
      # и в дереве их не видно. Локальных сборок APK нет — итог виден
      # только здесь. AGP 8.x кладёт файл в подкаталог задачи
      # processStandardDebugMainManifest, отсюда `**`.
      - name: Upload Merged Manifest (debug)
        uses: actions/upload-artifact@v7
        if: ${{ success() }}
        with:
          name: clodclash-merged-manifest-debug
          if-no-files-found: error
          retention-days: 7
          path: |
            app/build/intermediates/merged_manifests/standardDebug/**/AndroidManifest.xml

      # R8 запускается только в релизной сборке, а этот воркфлоу собирал один
      # debug — поэтому сломанная минификация всплывала лишь при выпуске версии
      # (22.08 так вылезли метаданные Kotlin 2.4). Гоняем не весь
      # assembleStandardRelease: задача minify не тянет за собой ни Go, ни CMake,
      # то есть проверка стоит минут, а не десятков.
      - name: Minify release with R8
        if: success()
        run: |
          set -eo pipefail
          ./gradlew --no-daemon -Pclod.abi=arm64-v8a \
            app:minifyStandardReleaseWithR8 \
            app:optimizeStandardReleaseResources 2>&1 | tee r8.log

      # Непонятные ему метаданные Kotlin R8 сообщает ПРЕДУПРЕЖДЕНИЕМ: сборка
      # зелёная, а сигнатуры классов молча теряются. Видно это только в логе.
      # Строку про async parsing он печатает всегда — она не в счёт.
      - name: Check R8 log
        if: success()
        run: |
          set -eo pipefail
          if grep -nE "R8: (An error occurred when parsing kotlin metadata|Unsupported)" r8.log; then
            echo "::error::R8 не разобрал метаданные Kotlin — поднять com.android.tools:r8 в gradle/libs.versions.toml"
            exit 1
          fi

      # Мост JNI зовётся из C по именам и держится на @Keep у классов моста
      # и правилах модуля, а не на -dontobfuscate в app/proguard-rules.pro.
      # Уедут аннотации или правила — APK соберётся, но ядро не стартует;
      # в dex это видно сразу.
      - name: Check JNI bridge in dex
        if: success()
        run: |
          set -eo pipefail
          dir=app/build/intermediates/dex/standardRelease/minifyStandardReleaseWithR8
          ls "$dir"/classes*.dex >/dev/null
          cat "$dir"/classes*.dex > "$RUNNER_TEMP/all.dex"
          fail=0
          for sym in com/github/kr328/clash/core/bridge/Bridge nativeStartTun nativeStopTun nativeQueryTunnelState; do
            grep -aq "$sym" "$RUNNER_TEMP/all.dex" || { echo "::error::$sym не найден в dex после R8"; fail=1; }
          done
          [ $fail -eq 0 ]
