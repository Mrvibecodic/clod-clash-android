name: Build Check
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  BuildDebug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      
      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      # - name: Signing properties
      #   env:
      #     SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      #     SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      #     SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      #   run: |
      #     touch signing.properties
      #     echo keystore.password="$SIGNING_STORE_PASSWORD" > signing.properties
      #     echo key.alias="$SIGNING_KEY_ALIAS" >> signing.properties
      #     echo key.password="$SIGNING_KEY_PASSWORD" >> signing.properties
      # Разбор заголовков панели живёт в Go, и проверяется он тоже на Go —
      # самым первым шагом: пакет `native/config/panel` не зависит ни от ядра,
      # ни от Android, собирается из одной стандартной библиотеки за секунду,
      # и ждать ради него Gradle с NDK незачем.
      #
      # Именно этот пакет, а не `native/config` целиком: соседи по каталогу
      # тянут `native/app`, а тот зовёт mihomo-функции из файла с тегами
      # `android && cmfa` — на хост-платформе их нет, и сборка падает.
      - name: Go unit tests
        id: go-tests
        if: success()
        working-directory: core/src/main/golang
        run: go test ./native/config/panel/...

      # Unit-тесты на чистые считалки — ДО сборки приложения: они дешевле
      # (:core им нужен, а вот сборка APK, R8 и упаковка — нет), и красная
      # считалка не должна стоить полного прогона до фидбэка. В том же джобе,
      # а не отдельным: Go на :core тратится один раз на оба шага.
      #
      # Три модуля: :service (пороги напоминаний, разбор panel.json),
      # :core (упакованный счётчик трафика), :design (размеры, имена файлов
      # логов, проверки полей ввода).
      - name: Unit tests
        id: unit-tests
        if: success()
        run: >-
          ./gradlew --no-daemon -Pclod.abi=arm64-v8a
          service:testStandardDebugUnitTest
          core:testStandardDebugUnitTest
          design:testStandardDebugUnitTest

      - name: Upload Test Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.unit-tests.outcome == 'failure' }}
        with:
          name: unit-test-report
          if-no-files-found: ignore
          # HTML — читать глазами, XML — машине: без него результат теста
          # виден только внутри архива.
          path: |
            service/build/reports/tests/
            service/build/test-results/
            core/build/reports/tests/
            core/build/test-results/
            design/build/reports/tests/
            design/build/test-results/

      - name: Build
        if: success()
        run: ./gradlew --no-daemon app:assembleStandardDebug -Pclod.abi=arm64-v8a

      # Один артефакт вместо четырёх: сборка идёт по одной ABI (-Pclod.abi=arm64-v8a),
      # flavor схлопнут в standard, тип debug. Прежние четыре шага указывали на
      # apk/alpha/release/* — этого каталога после ребрендинга не существует,
      # и артефакт не выкладывался вообще.
      - name: Upload Artifact (debug, arm64-v8a)
        uses: actions/upload-artifact@v7
        if: ${{ success() }}
        with:
          name: clodclash-debug-arm64-v8a
          if-no-files-found: error
          path: |
            app/build/outputs/apk/standard/debug/*.apk
