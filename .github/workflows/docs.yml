name: Docs

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run types:check

      - name: Build static site
        run: npm run build

      - name: Verify export
        run: |
          test -f out/index.html
          test -f out/ru/index.html
          test -f out/en/index.html
          test -f out/ru/docs/index.html
          test -f out/ru/download/index.html
          test -f out/en/download/index.html
          test -f out/promo.png
          test -f out/.nojekyll
          test -f out/screenshots/ru/more.png
          test -f out/screenshots/en/more.png

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
