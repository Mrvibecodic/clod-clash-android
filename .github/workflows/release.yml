name: Release

on:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check_version:
    name: Сверка версии
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      version_code: ${{ steps.v.outputs.version_code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Тег, схема versionCode и рост версии
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG_REF="${GITHUB_REF_NAME:-${GITHUB_REF##*/}}"
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' build.gradle.kts | head -1)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' build.gradle.kts | head -1)
          EXPECTED_TAG="android-v$VERSION_NAME"

          if [[ "$TAG_REF" != "$EXPECTED_TAG" ]]; then
            echo "::error::Тег $TAG_REF не совпадает с build.gradle.kts (ожидался $EXPECTED_TAG)"
            exit 1
          fi

          BASE="${VERSION_NAME%%-*}"
          SUFFIX=""
          [[ "$VERSION_NAME" == *-* ]] && SUFFIX="${VERSION_NAME#*-}"

          if [[ ! "$BASE" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::versionName $VERSION_NAME не разбирается как major.minor.patch[-суффикс]"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"; MINOR="${BASH_REMATCH[2]}"; PATCH="${BASH_REMATCH[3]}"

          case "$SUFFIX" in
            '')            RANK=99 ;;
            alpha.[1-9]|alpha.1[0-9]|alpha.20)  RANK="${SUFFIX#alpha.}" ;;
            beta.[1-9]|beta.1[0-9]|beta.20)     RANK=$(( 30 + ${SUFFIX#beta.} )) ;;
            rc.[1-9]|rc.1[0-9]|rc.20)           RANK=$(( 60 + ${SUFFIX#rc.} )) ;;
            *)
              echo "::error::Суффикс версии '$SUFFIX' не поддержан. Разрешены alpha.N, beta.N, rc.N (N от 1 до 20)"
              exit 1 ;;
          esac

          EXPECTED_CODE=$(( ((MAJOR * 100 + MINOR) * 100 + PATCH) * 100 + RANK ))

          if [[ "$VERSION_CODE" != "$EXPECTED_CODE" ]]; then
            echo "::error::versionCode $VERSION_CODE не соответствует versionName $VERSION_NAME (ожидался $EXPECTED_CODE)."
            echo "::error::Схема: ((major*100 + minor)*100 + patch)*100 + ранг, где ранг = 99 у обычной версии, N у alpha.N, 30+N у beta.N, 60+N у rc.N. Так предварительная сборка всегда МЕНЬШЕ своего финала, и финал до неё доезжает."
            exit 1
          fi

          manifest_code() {
            local tag="$1" id
            id=$(gh api "repos/$REPO/releases/tags/$tag" \
              --jq '.assets[] | select(.name == "latest.json") | .id' 2>/dev/null || true)
            if [[ ! "$id" =~ ^[0-9]+$ ]]; then
              echo 0
              return
            fi
            gh api -H "Accept: application/octet-stream" \
              "repos/$REPO/releases/assets/$id" 2>/dev/null | jq -r '.versionCode // 0'
          }

          PREV_RELEASE=$(manifest_code updater)
          PREV_PRE=$(manifest_code updater-prerelease)
          PREV=$PREV_RELEASE
          (( PREV_PRE > PREV )) && PREV=$PREV_PRE

          if (( PREV == 0 )); then
            echo "Прошлых манифестов нет — проверять рост не с чем"
          elif (( VERSION_CODE <= PREV )); then
            echo "::error::versionCode $VERSION_CODE не больше выпущенного ранее ($PREV). Такое обновление не примет ни один установленный клиент."
            exit 1
          else
            echo "Рост версии в порядке: $PREV -> $VERSION_CODE"
          fi

          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Версия $VERSION_NAME ($VERSION_CODE)"

  prepare_release:
    name: Черновик релиза
    needs: check_version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Создать черновик (или пересоздать старый)
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          existing=''
          if out=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '{id: .id, draft: .draft}' 2>/dev/null); then
            existing="$out"
          fi
          if [[ -n "$existing" ]]; then
            if [[ "$(echo "$existing" | jq -r .draft)" == "true" ]]; then
              gh api -X DELETE "repos/${{ github.repository }}/releases/$(echo "$existing" | jq -r .id)"
              echo "Старый черновик удалён"
            else
              echo "::error::Релиз $TAG уже опубликован — перезаписывать не будем"
              exit 1
            fi
          fi

          PRERELEASE=false
          [[ "${{ needs.check_version.outputs.version }}" == *-* ]] && PRERELEASE=true

          id=$(gh api -X POST "repos/${{ github.repository }}/releases" \
            -f tag_name="$TAG" \
            -f name="Clod Clash для Android $TAG" \
            -f body="Черновик — наполняется сборкой." \
            -F draft=true -F prerelease=$PRERELEASE --jq .id)
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Сборка
    needs: [check_version, prepare_release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Подтянуть submodule ядра
        run: git submodule update --init --recursive --force

      - name: Патчи ядра mihomo
        run: |
          set -euo pipefail
          cd core/src/foss/golang/clash
          for p in $GITHUB_WORKSPACE/.github/patch-core/*.patch; do patch --verbose -p 1 -F 0 < "$p"; done
          grep -q ProbeHolding adapter/adapter.go
          grep -q ProbeHolding adapter/outboundgroup/groupbase.go
          grep -q ProbeFreezeGap constant/probehold.go
          grep -Eq 'expectedStatus +string' adapter/outboundgroup/selector.go
          grep -Eq '"expectedStatus": +s\.expectedStatus,' adapter/outboundgroup/selector.go
          grep -Eq 'expectedStatus: +option\.ExpectedStatus,' adapter/outboundgroup/selector.go
          grep -q ResetNetwork adapter/outbound/base.go
          grep -q ErrRedirectDowngrade component/http/http.go
          grep -A1 -F 'loadProvider(cfg.RuleProviders)' hub/executor/executor.go | grep -qF 'tunnel.OnRunning()'
          grep -A1 -F 'tunnel.OnRunning()' hub/executor/executor.go | grep -qF 'runtime.GC()'
          # -F 0 запрещает нечёткий контекст, но не смещение: остатки .orig/.rej
          # означают, что патч лёг не туда, куда писался.
          if [ -n "$(find . \( -name '*.orig' -o -name '*.rej' \) -print -quit)" ]; then
            echo "::error::патч ядра лёг со смещением или с отказом"
            find . \( -name '*.orig' -o -name '*.rej' \)
            exit 1
          fi

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-disabled: true

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'
          cache: false

      - name: Патчи Go-тулчейна
        run: |
          set -euo pipefail
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 -F 0 < "$p"; done
          # Стражи на оба патча: первый ДОБАВЛЯЕТ ветку, второй УДАЛЯЕТ две.
          grep -q 'tailscale/tailscale/issues/13452' src/os/pidfd_linux.go
          test "$(grep -c 'if use64bitsTimeOn32bits' src/runtime/os_linux32.go)" = "0"

      - name: Обновить CA-сертификаты ядра
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt
          # Пустой или несостоявшийся бандл ядро не заметит — молча уедет на
          # хранилище устройства.
          test -s core/src/foss/golang/clash/component/ca/ca-certificates.crt
          test "$(grep -c 'BEGIN CERTIFICATE' core/src/foss/golang/clash/component/ca/ca-certificates.crt)" -gt 100

      - name: Сборка релиза
        run: ./gradlew --no-daemon --no-build-cache app:assembleStandardRelease

      - name: Проверка выравнивания 16 KB
        run: |
          set -euo pipefail
          READELF=$(find "$ANDROID_HOME/ndk" -name 'llvm-readelf' -print -quit)
          [[ -n "$READELF" && -x "$READELF" ]] || { echo "::error::llvm-readelf не найден в $ANDROID_HOME/ndk"; exit 1; }
          echo "readelf: $READELF"
          fail=0
          checked=0
          for apk in app/build/outputs/apk/standard/release/*.apk; do
            tmp=$(mktemp -d)
            unzip -q -o "$apk" 'lib/*' -d "$tmp"
            while IFS= read -r so; do
              if ! aligns=$("$READELF" -l "$so" | awk '/LOAD/ {print $NF}' | sort -u); then
                echo "::error::$(basename "$apk") :: ${so#$tmp/}: readelf не смог прочитать файл"
                fail=1
                continue
              fi
              checked=$((checked + 1))
              bad=$(echo "$aligns" | grep -vE '^0x(4000|10000)$' || [[ $? -eq 1 ]])
              if [[ -n "$bad" ]]; then
                echo "::error::$(basename "$apk") :: ${so#$tmp/} выравнен на $(echo "$bad" | paste -sd, -), нужно 0x4000 или 0x10000"
                fail=1
              fi
            done < <(find "$tmp/lib/arm64-v8a" "$tmp/lib/x86_64" -name '*.so' 2>/dev/null)
            rm -rf "$tmp"
          done
          echo "проверено .so: $checked"
          [[ $checked -gt 0 ]] || { echo "::error::Ни одной библиотеки .so не проверено"; exit 1; }
          [[ $fail -eq 0 ]] || exit 1

      - name: Неподписанные APK для подписи
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-unsigned
          if-no-files-found: error
          retention-days: 7
          path: app/build/outputs/apk/standard/release/*-unsigned.apk

  sign:
    name: Подпись и заливка
    needs: [check_version, prepare_release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-unsigned
          path: unsigned

      - name: Подписать APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Секрет KEYSTORE_BASE64 не задан — релиз нельзя подписать"
            exit 1
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          KS="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$KS" "$RUNNER_TEMP/aligned.apk"' EXIT
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          mkdir -p signed
          count=0
          for apk in unsigned/*-unsigned.apk; do
            name=$(basename "$apk" -unsigned.apk).apk
            "$BT/zipalign" -f -P 16 4 "$apk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign \
              --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --v1-signing-enabled true --v2-signing-enabled true \
              --v3-signing-enabled false --v4-signing-enabled false \
              --out "signed/$name" "$RUNNER_TEMP/aligned.apk"
            count=$((count + 1))
          done
          [[ $count -gt 0 ]] || { echo "::error::Нет APK для подписи"; exit 1; }
          echo "подписано APK: $count"

      - name: Проверить подпись
        env:
          CERT_SHA256: aa3ac63121c7f6dcbc62bbbe0c372b1ceaef9ba86bf6d96eae99c6c840d3c62c
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in signed/*.apk; do
            out=$("$BT/apksigner" verify -v --print-certs "$apk")
            grep -q 'Verified using v1 scheme (JAR signing): true' <<< "$out"
            grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$out"
            grep -q 'Number of signers: 1' <<< "$out"
            grep -q "Signer #1 certificate SHA-256 digest: $CERT_SHA256" <<< "$out" || {
              echo "::error::$(basename "$apk") подписан не релизным ключом"
              exit 1
            }
            "$BT/zipalign" -c -P 16 4 "$apk"
            echo "подпись в порядке: $(basename "$apk")"
          done

      - name: Переименовать APK и посчитать SHA-256
        id: assets
        run: |
          set -euo pipefail
          mkdir -p dist
          for apk in signed/*.apk; do
            name=$(basename "$apk")
            abi=universal
            for candidate in arm64-v8a armeabi-v7a x86_64 x86; do
              if [[ "$name" == *"-$candidate-"* ]]; then abi="$candidate"; break; fi
            done
            cp "$apk" "dist/clodclash-$abi.apk"
            echo "$abi clodclash-$abi.apk" >> dist/abis.txt
          done
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt abis.txt

      - name: Собрать latest.json
        env:
          VERSION: ${{ needs.check_version.outputs.version }}
          VERSION_CODE: ${{ needs.check_version.outputs.version_code }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NOTES=$(awk -v ver="## v$VERSION" '
            $0 == ver { grab = 1; next }
            /^## v/ || /^---/ { if (grab) exit }
            grab { print }
          ' UPDATELOG.md 2>/dev/null || true)
          if [[ -z "${NOTES// }" ]]; then
            NOTES=$(git tag -l --format='%(contents)' "$TAG")
          fi
          if [[ -z "${NOTES// }" ]]; then
            NOTES="Вышла версия $VERSION."
          fi

          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          jq -n \
            --arg version "$VERSION" \
            --argjson versionCode "$VERSION_CODE" \
            --arg notes "$NOTES" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --arg base "$BASE" \
            --slurpfile sums <(
              cd dist && while read -r abi file; do
                hash=$(awk -v f="$file" '$2 == f {print $1}' SHA256SUMS.txt)
                size=$(stat -c %s "$file")
                jq -n --arg abi "$abi" --arg f "$file" --arg h "$hash" --argjson s "$size" \
                  '{abi:$abi, file:$f, sha256:$h, size:$s}'
              done < abis.txt | jq -s .
            ) '
            {
              version: $version,
              versionCode: $versionCode,
              notes: $notes,
              pub_date: $pub_date,
              platforms: ($sums[0] | map({
                key: .abi,
                value: {url: ($base + "/" + .file), sha256: .sha256, size: .size}
              }) | from_entries)
            }' > dist/latest.json
          cat dist/latest.json

      - name: Залить в черновик релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare_release.outputs.release_id }}
        run: |
          set -euo pipefail
          for f in dist/*; do
            name=$(basename "$f")
            old=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
              --jq ".[] | select(.name == \"$name\") | .id" 2>/dev/null || true)
            if [[ "$old" =~ ^[0-9]+$ ]]; then
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$old"
            fi
            gh api --method POST \
              -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$name" \
              --input "$f" >/dev/null
            echo "залито: $name"
          done

  publish:
    name: Публикация
    needs: [check_version, prepare_release, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Проверить, что релиз укомплектован
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare_release.outputs.release_id }}
        run: |
          set -euo pipefail
          assets=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" --jq '.[].name')
          echo "$assets"
          for needle in latest.json SHA256SUMS.txt universal.apk arm64-v8a.apk armeabi-v7a.apk; do
            if ! echo "$assets" | grep -qi -- "$needle"; then
              echo "::error::В релизе нет файла по маске '$needle'"
              exit 1
            fi
          done

      - name: Опубликовать как pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare_release.outputs.release_id }}
          VERSION: ${{ needs.check_version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NOTES=$(awk -v ver="## v$VERSION" '
            $0 == ver { grab = 1; next }
            /^## v/ || /^---/ { if (grab) exit }
            grab { print }
          ' UPDATELOG.md 2>/dev/null || true)
          [[ -z "${NOTES// }" ]] && NOTES=$(git tag -l --format='%(contents)' "$TAG")
          [[ -z "${NOTES// }" ]] && NOTES="Вышла версия $VERSION."

          PRERELEASE=false
          [[ "$VERSION" == *-* ]] && PRERELEASE=true

          gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            -F draft=false -F prerelease=$PRERELEASE -f body="$NOTES" --jq .html_url

      - name: Разложить манифест по плавающим релизам
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare_release.outputs.release_id }}
          VERSION: ${{ needs.check_version.outputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name == "latest.json") | .id' > /tmp/asset_id
          gh api -H "Accept: application/octet-stream" \
            "repos/${{ github.repository }}/releases/assets/$(cat /tmp/asset_id)" > latest.json

          ensure_release() {
            local tag="$1" name="$2" body="$3" id=''
            if out=$(gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq .id 2>/dev/null); then
              [[ "$out" =~ ^[0-9]+$ ]] && id="$out"
            fi
            if [[ -z "$id" ]]; then
              id=$(gh api -X POST "repos/${{ github.repository }}/releases" \
                -f tag_name="$tag" -f name="$name" -f body="$body" \
                -F draft=false -F prerelease=true --jq .id)
            fi
            echo "$id"
          }

          put_manifest() {
            local id="$1" old
            old=$(gh api "repos/${{ github.repository }}/releases/$id/assets" \
              --jq '.[] | select(.name == "latest.json") | .id' 2>/dev/null || true)
            if [[ "$old" =~ ^[0-9]+$ ]]; then
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$old"
            fi
            gh api --method POST \
              -H "Content-Type: application/json" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$id/assets?name=latest.json" \
              --input latest.json >/dev/null
          }

          pre=$(ensure_release updater-prerelease "Манифест предварительных сборок" \
            "Служебный релиз: latest.json самой свежей сборки, включая предварительные. Не скачивайте отсюда APK.")
          put_manifest "$pre"
          echo "latest.json разложен в updater-prerelease"

          legacy=$(ensure_release updater-nightly "Манифест предварительных сборок для старых версий" \
            "Служебный релиз для сборок до 0.1.18, которые ищут манифест здесь. Не скачивайте отсюда APK.")
          put_manifest "$legacy"
          echo "latest.json разложен в updater-nightly"

          if [[ "$VERSION" == *-* ]]; then
            echo "Версия $VERSION предварительная — updater не трогаем"
            exit 0
          fi

          upd=$(ensure_release updater "Манифест обновлений" \
            "Служебный релиз: здесь всегда лежит latest.json текущей обычной версии. Не скачивайте отсюда APK.")
          put_manifest "$upd"
          echo "latest.json разложен в updater"
